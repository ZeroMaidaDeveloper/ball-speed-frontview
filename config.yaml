# Cricket ball speed pipeline configuration.
# The single most important accuracy lever is per-video camera calibration
# (see `calibration:` below) when a `<video_stem>_calib.json` sidecar
# exists; `geometry.flight_distance_m` is only a fallback for videos
# without one -- see pipeline/speed.py and pipeline/calibration.py.

paths:
  videos_dir: "."
  frames_dir: "data/frames"
  labels_dir: "data/labels"
  models_dir: "models"
  runs_dir: "runs"
  yolo_weights: "models/ball_yolo26s.pt"   # written by training/train_yolo.py

# Real-world constants
ball:
  diameter_m: 0.0715          # standard men's cricket ball diameter

geometry:
  # Fallback ONLY, used when a video has no `<video_stem>_calib.json`
  # sidecar (see calibration: below and pipeline/calibration.py) -- divides
  # this fixed assumed flight distance by however much of the flight got
  # tracked, which is only valid if the track happens to span the WHOLE
  # release-to-arrival flight. For this project's delivery_*.mp4 nets
  # footage the tracked segment is usually a partial fragment (the ball
  # is lost once too small/dark against the netting), so this fallback
  # is known to be inaccurate there -- that's what the calibrated
  # per-video estimate below replaces. Kept only for videos without a
  # calibration file yet.
  flight_distance_m: 17.0

# Per-video camera calibration (see pipeline/calibration.py). When
# `<video_stem>_calib.json` exists next to a video (giving the near/far
# stump pixel heights in a reference frame), pipeline/speed.py derives
# that video's focal length and computes ball distance-from-camera at
# every tracked frame directly from the ball's own apparent diameter
# (pinhole model) -- accurate even for a partial track, unlike the
# geometry.flight_distance_m fallback. These two constants are shared
# across videos since they're standard cricket dimensions, not per-venue.
calibration:
  stump_height_m: 0.711    # regulation stump height (28in), matches the wicket_distance_m the source project's own ball_speed.py calibration tool used
  pitch_length_m: 20.12    # regulation stumps-to-stumps pitch length (22 yards)
  # Speed is fit from the ball's estimated distance-from-camera z(t) over
  # the track's real (non-kalman_predicted) frames. But a track can run on
  # past where the real ball was lost (e.g. zoom_track_detect.py's motion-
  # diff rescue locking onto a catcher's hands once the ball arrives) --
  # z(t) then stops increasing and starts wandering, which a plain
  # endpoint-to-endpoint or least-squares fit over the WHOLE track would
  # silently corrupt. Instead: walk forward from the first frame, tracking
  # a running max of z (smoothed over smoothing_window frames); once z
  # drops more than reversal_tolerance_m below that running max for
  # reversal_confirm_frames consecutive frames running, treat that as the
  # real ball having been lost and fit only the prefix before it.
  # Tuned against delivery_4/7/19/21's actual z(t) noise (see scratch
  # investigation in conversation history): diam_px is often single-digit
  # pixels for much of a receding ball's flight, so per-frame z jitters by
  # several METERS even within a visually-confirmed-correct stretch of
  # track -- a tight tolerance (originally 0.5) mistook that noise for a
  # trend break and cut delivery_4's genuinely-good 42-frame run down to
  # 5. reversal_tolerance_m=3.0 absorbs that local jitter while still
  # catching the much larger (~15-20m), sustained reversal a real drift
  # onto a non-ball object produces.
  smoothing_window: 7
  reversal_tolerance_m: 3.0
  reversal_confirm_frames: 6
  min_frames_for_fit: 5    # below this many usable (post-trim) frames, the fit is too noisy to trust -- see speed.py: quality flag "few_calibrated_frames"
  # Below this r^2, the fitted line is a poor match for the observed
  # distance-vs-time points even after trimming -- a real signal that
  # something in the track (drift onto a non-ball object, bad diameter
  # measurements) is still corrupting it. Set low, not near 1.0: even a
  # verified-correct track only reaches ~0.35-0.8 here, since diam_px
  # quantization noise dominates the pinhole-distance estimate -- but
  # observed drift-corrupted tracks (delivery_7.mp4's entire post-release
  # track locks onto the bowler's own follow-through motion, confirmed by
  # visual inspection) score noticeably lower still (~0.1-0.2), so this
  # threshold is chosen to separate the two, not to demand a strong fit.
  min_fit_r2: 0.25

speed:
  # Plausible bowling-speed sanity bounds (km/h). Estimates outside this
  # range are flagged low-confidence rather than silently reported.
  min_plausible_kmh: 40
  max_plausible_kmh: 160
  # Smoothing window (frames) for the secondary size-based speed curve.
  size_curve_smoothing_window: 5

detection:
  # LAB a*-channel "red-ness" thresholds. NOT a hard color gate -- in this
  # footage the ball's worn-leather color overlaps players' pink/magenta
  # shirts seen through the net, so pipeline/classical_detect.py only uses
  # these as a soft confidence nudge on top of motion+shape filtering (real
  # discrimination comes from track.py's downstream motion-continuity
  # gating). See pipeline/classical_detect.py module docstring.
  lab_a_channel_min: 150
  lab_l_channel_min: 40
  lab_l_channel_max: 220
  # MOG2 background subtractor params
  mog2_history: 400
  mog2_var_threshold: 24
  mog2_detect_shadows: false
  # Frames spent building up the activity map (see activity_decay/
  # activity_max below) before lab_scale_detect.py emits ANY candidates --
  # was a hardcoded 40 until short clips arrived (~140-180 frames each,
  # release happening in the first third) where a 40-frame blind spot ate
  # the actual delivery. 15 still gives MOG2's background model and the
  # activity map a real head start on the original ~300-360 frame clips
  # (where this was tuned) without costing as much of a short one.
  warmup_frames: 15
  # Candidate blob filtering
  min_ball_area_px: 6
  max_ball_area_px: 2500
  min_circularity: 0.55
  # Recurring-motion suppression: netting/leaves flap in roughly the same
  # spot for many consecutive frames, unlike the ball which sweeps through
  # a new position every frame. Each pixel accumulates
  # `activity = activity*activity_decay + is_foreground` per frame (in
  # lab_scale_detect.py, EXCLUDING pixels covered by a detected person --
  # see that module's _non_person_mask: without this, a player who's
  # simply been standing/fidgeting in one screen region pushes that
  # region's activity above activity_max on its own, which then also
  # suppresses the real ball the instant it flies through or near that
  # same region -- observed on teevra.mov, where the ball passes right
  # next to a batsman); a blob is dropped as noise if its mean activity
  # exceeds activity_max (i.e. that spot has been flickering foreground
  # repeatedly, not just this once). Empirically tuned against Takneek/
  # 1000313863.mp4 (see pipeline/classical_detect.py): without this, MOG2
  # alone throws ~24 candidate blobs/frame of net/leaf texture and the
  # tracker locks onto noise.
  activity_decay: 0.98
  activity_max: 0.5
  # YOLO hybrid fusion. models/ball_yolo26s.pt is currently just the stock
  # COCO-pretrained yolo26s checkpoint (no cricket-ball fine-tuning yet) --
  # its generic "sports ball" class empirically already tracks the ball in
  # this footage (see pipeline/yolo_detect.py docstring), but at low
  # confidence (observed ~0.10-0.5 on confirmed real ball frames), so the
  # emission threshold is set low and downstream motion/shape filtering in
  # track.py does the real noise rejection -- same philosophy as
  # classical_detect.py's activity filter.
  yolo_conf_threshold: 0.10
  yolo_min_conf_trust: 0.45   # above this, trust YOLO without classical corroboration
  # Shared by yolo_detect.py and lab_scale_detect.py: restrict candidates
  # to <video>_roi.json's polygon (pipeline/roi_utils.py) when one exists
  # next to the video. A full-frame YOLO pass has no person exclusion of
  # its own and routinely outnumbered lab_scale_detect.py's candidates
  # 10-30x on real clips -- this was the dominant remaining noise source
  # once lab_scale_detect.py gained ROI + person-mask filtering.
  use_roi: true

tracking:
  # Frame-to-frame association gating
  max_center_jump_px: 140
  max_missed_frames_bridge: 6      # Kalman-predicted bridge across short net-occlusion gaps
  delivery_gap_merge_s: 0.4        # merge two tracks separated by less than this (occlusion fragment)
  delivery_boundary_gap_s: 1.5     # gap larger than this = genuinely a new delivery
  min_track_len_frames: 5          # discard tracks shorter than this as noise
  # A real delivery's apparent diameter changes substantially over the
  # track -- but the DIRECTION depends on camera placement, and this
  # project has footage of both kinds: a camera at the batting end sees
  # the ball grow as it approaches; the delivery_4/7/19/21.mp4 nets
  # footage instead has the camera near the bowling end (confirmed by
  # visual inspection -- the bowler fills the frame at release, the
  # striker is small and distant), so the ball SHRINKS as it recedes
  # (observed diam_growth_ratio ~0.37-0.74 on real tracked deliveries
  # there once pipeline/zoom_track_detect.py's motion-diff rescue
  # extended tracking well past release -- see that module's docstring).
  # A static/jittering background blob (netting, leaves) does neither.
  # min_diam_growth_ratio / max_diam_shrink_ratio are the growth/shrink
  # thresholds (each computed as (median of last third real diam_px) /
  # (median of first third)) required to keep a track -- chosen well
  # beyond a real flight's ratio in either direction but short of what
  # noise jitter alone produces. A track passes if EITHER condition holds
  # (see pipeline/speed.py: _quality_flags -- "low_diam_change").
  min_diam_growth_ratio: 1.6
  max_diam_shrink_ratio: 0.7
  # Constant-velocity gap-bridging (delivery_gap_merge_s/max_center_jump_px
  # above) only works for short gaps where the ball's motion is locally
  # linear. Near the end of a delivery, perspective makes the ball
  # accelerate rapidly as it nears the camera, so a longer detection gap
  # there produces a big, non-linear position jump that constant-velocity
  # extrapolation correctly refuses to bridge -- which fragments the real
  # delivery into two undersized, low-growth tracks that both get dropped.
  # Ported from the user's own pipeline_common.py: fit_parabola() (cx
  # linear-in-t, cy quadratic-in-t, iterative 2.5-sigma outlier rejection)
  # as a second, physics-aware merge test tried when the constant-velocity
  # one fails or the gap is too long for it to even attempt.
  parabola_gap_merge_s: 0.7      # wider allowance than delivery_gap_merge_s -- this path is physically grounded, not just extrapolated
  parabola_max_jump_px: 260      # looser than max_center_jump_px -- extrapolation uncertainty grows with gap length
  parabola_min_real_frames: 4    # minimum real (non-predicted) frames in the earlier track needed to trust a parabola fit

heatmap_refine:
  # A far-away ball is only a few pixels across in the full 1920x1080
  # frame -- too small, relative to the image, for YOLO to reliably see,
  # even though faint MOG2 motion + LAB color evidence exists at its true
  # location (see pipeline/heatmap_refine.py). This crops+upscales a
  # window around that evidence peak and re-runs YOLO on just that crop,
  # where the ball takes up a much larger fraction of what the network
  # sees.
  roi_half_size_px: 90       # crop window is a (2*roi_half_size_px) square
  upscale_factor: 4          # crop is resized up by this before YOLO sees it
  heatmap_blur_ksize: 15     # Gaussian blur (odd) smoothing the combined MOG2+LAB evidence map
  min_heatmap_peak: 40       # a connected evidence region below this peak isn't worth zooming into; combined evidence is 0..510 pre-blur
  # A single global max per frame gets dominated by whatever produces the
  # loudest evidence anywhere in the frame (almost always a player, not
  # the far fainter ball) -- propose up to this many independent local
  # peaks per frame instead, and let YOLO itself filter them. Kept low (2
  # rather than 4): each extra peak is another YOLO call per frame, and on
  # a long, unrestricted (no ROI) video this was the dominant cost of the
  # whole pipeline -- a full run at max_peaks=4 didn't finish in over an
  # hour even after batching crops per frame into one predict() call.
  max_peaks: 2
  # A player moving produces a much bigger blurred evidence blob than a
  # small/far ball ever would -- drop connected components larger than
  # this (in blurred-mask pixels, a coarser scale than
  # detection.max_ball_area_px which is calibrated against tight unblurred
  # contours) so player-sized blobs don't crowd out ball-sized proposals.
  max_component_area_px: 4000
  yolo_conf_threshold: 0.10  # same low-threshold-then-filter-downstream philosophy as detection.yolo_conf_threshold

lab_scale_detect:
  # Ported from the user's own labeling tool (Auto labelling usin LAB
  # Scale/Auto_Model_Training/ball_label.py + ball_label_white.py) --
  # see pipeline/lab_scale_detect.py for why this is a DELIBERATELY
  # different tradeoff from detection.lab_* (hard color gate instead of a
  # soft nudge, and MOG2 runs on a CLAHE-contrast-enhanced L channel
  # instead of raw BGR) so the two approaches can be compared side by
  # side in the viewer.
  ball_color: red           # "red" | "white"
  red_mean_a_min: 135       # hard gate (red ball): contour's mean LAB a* (OpenCV 0-255 scale) must be >= this
  white_l_min: 190          # hard gate (white ball): contour's mean LAB L* must be >= this
  white_chroma_max: 25      # hard gate (white ball): hypot(mean_a-128, mean_b-128) must be <= this
  min_area_px: 3
  max_area_px: 1200
  min_fill_ratio: 0.35      # contourArea / (pi * minEnclosingCircle radius^2) -- a roundness measure
  max_aspect_ratio: 3.0     # bounding-box long-side/short-side
  clahe_clip_limit: 3.0
  clahe_tile_grid: 8        # tile grid is (N, N)
  # The two techniques that turned out to matter most once A/B'd against
  # the full auto-label pipeline on real clips (see pipeline/roi_utils.py
  # and pipeline/lab_scale_detect.py module docstring). ROI restriction is
  # detection.use_roi (shared with yolo_detect.py); person-mask exclusion
  # is specific to this module (yolo_detect.py doesn't run its own
  # segmentation pass):
  exclude_people: true       # drop any candidate centered inside a detected person's segmentation mask
  person_seg_model: "yolov8n-seg.pt"
  person_conf_threshold: 0.5
  person_min_height_ratio: 0.30   # relative to the tallest detected person this frame
  person_min_abs_height_px: 50
  person_mask_interval: 2         # re-run person segmentation every N frames, reusing masks in between

zoom_track_detect:
  # Rather than scanning the whole (ROI-restricted) frame with YOLO every
  # frame regardless of whether anything is happening, watch
  # lab_scale_detect.py's cleaner motion+color candidates for a FAST-
  # moving one -- the hallmark of a real ball in flight vs. noise or a
  # slow-moving player -- then zoom into the predicted next position and
  # run YOLO on just that crop. See pipeline/zoom_track_detect.py.
  #
  # Calibrated against delivery_4.mp4's confirmed real ball trajectory
  # (frames 129-137 @ 50fps): consecutive-frame implied speed there was
  # ~750-1050 px/s. fast_speed_px_s is set comfortably below that with
  # margin, not at it, so real (if slightly slower) deliveries still
  # trigger.
  fast_speed_px_s: 400
  max_search_gap_s: 0.15    # only compare two LAB hits for the speed trigger if they're within this much time of each other
  track_gate_px: 80         # while tracking, a LAB candidate within this of the prediction confirms the track (tried before the motion-diff rescue and the YOLO-crop rescue); also used as the motion-diff rescue's own gate distance
  # Three-frame-differencing rescue, tried after the LAB gate and before
  # the YOLO-crop rescue -- see pipeline/zoom_track_detect.py: _motion_rescue().
  # Calibrated against delivery_4.mp4's real ball (frames 137-149): it
  # desaturates from bright red to near-black against the dark green net/
  # foliage background well before it leaves the frame, defeating
  # lab_scale_detect.py's hard color gate while remaining a clean, compact,
  # consistently-sized moving blob.
  motion_rescue_half_size_px: 45   # search window is a (2*this) square around the prediction
  motion_rescue_diff_threshold: 15 # min per-pixel intensity change (0-255) on BOTH consecutive diffs to count as motion
  motion_rescue_min_area_px: 4
  motion_rescue_max_area_px: 350   # generous headroom since the ball's apparent size here is shrinking, not growing (see SCHEMA.md note on this footage's camera placement)
  motion_rescue_max_aspect_ratio: 3.0
  # Size-consistency gate applied to BOTH the LAB-gate and motion-diff-
  # rescue confirmation paths (see _size_ok()) -- same philosophy as
  # track.py's own tracker gating: reject a same-neighborhood candidate
  # whose implied diameter is wildly different from the track's current
  # expected size (an EMA over confirmed diam_px, see diam_ema_alpha).
  # Needed because, once the true ball is genuinely lost, a same-distance
  # gate alone isn't enough -- e.g. the bowler's own follow-through arm is
  # also "a compact moving blob near the prediction" and can otherwise
  # hijack the track (observed on delivery_7.mp4 before this was added).
  size_ratio_min: 0.4
  size_ratio_max: 2.5
  diam_ema_alpha: 0.4       # weight on the newest confirmed diam_px when updating the EMA
  # Direction-consistency gate applied to ALL THREE confirmation paths
  # (LAB-gate, motion-diff rescue, YOLO-crop rescue) -- see _direction_ok().
  # Added after size-consistency alone still let zoom_track_detect.py lock
  # onto the bowler's own follow-through motion on delivery_7.mp4: his
  # limbs are also roughly ball-sized, but their step-to-step direction
  # bears no relation to the ball's established heading. Measured against
  # delivery_7.mp4's confirmed real release trajectory (frames 124-133):
  # implied heading held within a ~13-degree band; once the real ball was
  # lost, subsequent (wrong) confirmations swung by 80-300 degrees frame to
  # frame. min_direction_cos=0.5 accepts up to +-60 degrees of deviation
  # from the heading EMA -- generous enough for real projectile curvature,
  # nowhere near the ~110+-degree swings the wrong-object case produced.
  min_direction_cos: 0.5
  direction_ema_alpha: 0.35 # weight on the newest confirmed step direction when updating the heading EMA
  # Decay applied to the extrapolation velocity on every frame that ends
  # with NO confirmation (LAB, motion-diff, or YOLO-crop all missed). A
  # receding ball decelerates in image-space, so holding velocity constant
  # across a run of misses makes the prediction overshoot further and
  # further from the ball's true position -- which both makes it harder to
  # ever reconfirm the real ball AND raises the odds the widened search
  # window drifts onto an unrelated nearby mover instead. Decaying pulls
  # the prediction back toward the last confirmed position as misses
  # accumulate, which is the safer default when position is uncertain.
  missed_velocity_decay: 0.75
  motion_rescue_conf: 0.20         # fixed, low -- pure motion+shape evidence with no color/class signal, same low-then-filter-downstream philosophy as detection.yolo_conf_threshold
  roi_half_size_px: 70      # crop window for the YOLO-crop rescue is a (2*roi_half_size_px) square
  upscale_factor: 4
  yolo_conf_threshold: 0.10
  max_missed_in_track: 6    # consecutive failed confirmations (LAB gate + motion-diff rescue + YOLO rescue) before dropping back to plain LAB scanning

video:
  # Nominal fps used only as a fallback; real per-frame timestamps are
  # read from the video container (CAP_PROP_POS_MSEC) wherever possible.
  fallback_fps: 30.0
